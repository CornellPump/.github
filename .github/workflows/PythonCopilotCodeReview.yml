name: Python Copilot Code Review

on:
  workflow_call:                   # makes this reusable — called from individual repos

# Skip draft PRs entirely
concurrency:
  group: copilot-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true        # if a new push comes in, cancel the in-flight review

jobs:
  copilot-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write         # needed to post PR comments

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0           # full history so we can diff against the base branch

      - name: Generate GitHub App token for org .github repo
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RPM_SQUARED_GITHUB_APP_ID }}
          private-key: ${{ secrets.RPM_SQUARED_GITHUB_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: .github    # token is scoped to this repo only

      - name: Fetch style guides from org .github repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/.github
          path: .org-github
          token: ${{ steps.app-token.outputs.token }}

      - name: Check for changed Python files
        id: changed-files
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}

          CHANGED=$(git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD)
          echo "Changed files:"
          echo "$CHANGED"

          echo "has_python=$(echo "$CHANGED" | grep -qE '\.py$' && echo true || echo false)" >> $GITHUB_OUTPUT

      - name: Build review prompt
        id: build-prompt
        if: steps.changed-files.outputs.has_python == 'true'
        run: |
          PROMPT="You are a code reviewer. Review ONLY the changed Python files in this PR diff.\n\n"
          PROMPT+="Do NOT comment on logic, architecture, performance, or anything outside the style guide.\n\n"
          PROMPT+="## Diff to review\n\n"
          PROMPT+="$(git diff origin/${{ github.event.pull_request.base.ref }}...HEAD -- '*.py')\n\n"
          PROMPT+="## Style guide\n\n"
          PROMPT+="$(cat .org-github/copilot-style-guides/python.md)\n\n"

          echo -e "$PROMPT" > /tmp/review_prompt.txt
          echo "prompt_file=/tmp/review_prompt.txt" >> $GITHUB_OUTPUT

      - name: Run Copilot review
        id: copilot
        if: steps.changed-files.outputs.has_python == 'true'
        uses: github/copilot-code-review-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          prompt-file: ${{ steps.build-prompt.outputs.prompt_file }}

      - name: Post passing comment if no issues found
        if: steps.changed-files.outputs.has_python == 'true' && steps.copilot.outputs.issues_found == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            // Avoid duplicate passing comments on repeated pushes
            const alreadyPosted = comments.some(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.includes('<!-- copilot-review-pass -->')
            );

            if (!alreadyPosted) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: [
                  '<!-- copilot-review-pass -->',
                  '✅ **Copilot style review passed** — no issues found.',
                  '',
                  `> Reviewed: ${new Date().toUTCString()}`,
                  `> Commit: ${context.sha.slice(0, 7)}`,
                ].join('\n')
              });
            } else {
              // Update the existing comment with the latest commit SHA
              const existing = comments.find(c =>
                c.user.login === 'github-actions[bot]' &&
                c.body.includes('<!-- copilot-review-pass -->')
              );
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: [
                  '<!-- copilot-review-pass -->',
                  '✅ **Copilot style review passed** — no issues found.',
                  '',
                  `> Reviewed: ${new Date().toUTCString()}`,
                  `> Commit: ${context.sha.slice(0, 7)}`,
                ].join('\n')
              });
            }
